sonar.projectKey=umbora-frontend
sonar.projectName=UmBora_Frontend
sonar.host.url=https://sedimentologic-crescentlike-tijuana.ngrok-free.dev
# NAO coloque o token aqui. O sonar-scanner le automaticamente a variavel
# de ambiente SONAR_TOKEN. Ex (PowerShell): $env:SONAR_TOKEN = "seu_token"
sonar.sources=src
sonar.exclusions=**/node_modules/**,**/dist/**,**/coverage/**

# Arquivos de teste classificados como testes (e não como codigo de producao)
sonar.tests=src
sonar.test.inclusions=**/__tests__/**,**/*.test.js,**/*.spec.js

# Excluidos do CALCULO de cobertura (testes, mocks e arquivos sem logica testavel).
# Sem isto, os arquivos de teste entram no denominador como 0% e derrubam a cobertura.
sonar.coverage.exclusions=**/__tests__/**,**/*.test.js,**/*.spec.js,**/mocks/**,**/*.config.js

sonar.javascript.lcov.reportPaths=coverage/lcov.info
